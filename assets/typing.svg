<svg
  width="900"
  height="125"
  viewBox="0 0 900 125"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- NEON GRADIENT -->
    <linearGradient
      id="cyberGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop offset="0%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#4da6ff;#8a2be2;#ff00ff;#00ffff"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#8a2be2">
        <animate
          attributeName="stop-color"
          values="#8a2be2;#ff00ff;#00ffff;#8a2be2"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate
          attributeName="stop-color"
          values="#ff00ff;#00ffff;#7a00ff;#ff00ff"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <!-- SOFT GLOW -->
    <filter
      id="glow"
      x="-20%"
      y="-100%"
      width="150%"
      height="300%">

      <feGaussianBlur
        stdDeviation="1.6"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- =====================================================
       TERMINAL COMMAND
       ===================================================== -->

  <text
    x="55"
    y="30"
    font-family="monospace"
    font-size="17"
    font-weight="bold"
    fill="#00ffff">

    root@n1se:~$ whoami

  </text>


  <!-- PROMPT -->

  <text
    x="55"
    y="72"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="#8b949e">

    &gt;

  </text>


  <!-- =====================================================
       PHRASE 01
       ===================================================== -->

  <text
    x="82"
    y="72"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Nirmal Semalti

    <animate
      attributeName="opacity"
      values="0;1;1;0;0"
      keyTimes="0;0.01;0.17;0.19;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- =====================================================
       PHRASE 02
       ===================================================== -->

  <text
    x="82"
    y="72"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Programmer. Problem Solver.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.20;0.21;0.37;0.39;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- =====================================================
       PHRASE 03
       ===================================================== -->

  <text
    x="82"
    y="72"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Building what I once couldn't.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.40;0.41;0.57;0.59;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- =====================================================
       PHRASE 04
       ===================================================== -->

  <text
    x="82"
    y="72"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Still a long way to go.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.60;0.61;0.77;0.79;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- =====================================================
       PHRASE 05
       ===================================================== -->

  <text
    x="82"
    y="72"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Keep building.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0"
      keyTimes="0;0.80;0.81;0.98;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- =====================================================
       BLINKING CURSOR
       ===================================================== -->

  <rect
    x="390"
    y="55"
    width="8"
    height="21"
    rx="1"
    fill="#ff00ff"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="0.8s"
      repeatCount="indefinite"/>

  </rect>


  <!-- =====================================================
       SYSTEM STATUS
       ===================================================== -->

  <circle
    cx="58"
    cy="105"
    r="3"
    fill="#00ff9c">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="72"
    y="109"
    font-family="monospace"
    font-size="9"
    letter-spacing="3"
    fill="#484f58">

    IDENTITY_STREAM://ACTIVE

  </text>

</svg>
