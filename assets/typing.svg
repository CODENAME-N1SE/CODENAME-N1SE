  <!-- =============================================
       TERMINAL COMMAND
       ============================================= -->

  <text
    x="70"
    y="40"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="#00ffff">

    root@n1se:~$ whoami

  </text>


  <!-- TERMINAL RESPONSE SYMBOL -->

  <text
    x="70"
    y="87"
    font-family="monospace"
    font-size="19"
    font-weight="bold"
    fill="#8b949e">

    &gt;

  </text>


