  <!-- =============================================
       MOVING TERMINAL CURSOR
       ============================================= -->

  <rect
    x="102"
    y="68"
    width="9"
    height="23"
    rx="1"
    fill="#ff00ff"
    filter="url(#glow)">

    <!--
      Cursor timeline:

      Phrase 1:
      start -> type -> pause -> erase

      Phrase 2:
      start -> type -> pause -> erase

      Phrase 3:
      start -> type -> pause -> erase

      Phrase 4:
      start -> type -> pause -> erase

      Phrase 5:
      start -> type -> longer pause -> erase
    -->

    <animate
      attributeName="x"
      dur="30s"
      repeatCount="indefinite"
      calcMode="linear"

      values="
      102;
      270;
      270;
      102;

      102;
      400;
      400;
      102;

      102;
      440;
      440;
      102;

      102;
      360;
      360;
      102;

      102;
      257;
      257;
      102
      "

      keyTimes="
      0;
      0.10;
      0.15;
      0.20;

      0.21;
      0.31;
      0.36;
      0.43;

      0.44;
      0.54;
      0.59;
      0.66;

      0.67;
      0.75;
      0.80;
      0.86;

      0.87;
      0.92;
      0.97;
      1
      "/>

    <!-- CURSOR BLINK -->

    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="0.7s"
      repeatCount="indefinite"/>

  </rect>


  <!-- =============================================
       SYSTEM STATUS
       ============================================= -->

  <circle
    cx="73"
    cy="120"
    r="3"
    fill="#00ff9c">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="87"
    y="124"
    font-family="monospace"
    font-size="9"
    letter-spacing="3"
    fill="#484f58">

    IDENTITY_STREAM://ACTIVE

  </text>

</svg>
