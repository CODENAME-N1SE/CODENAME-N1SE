<svg
  width="900"
  height="115"
  viewBox="0 0 900 115"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ============================================
         CYBERPUNK ANIMATED GRADIENT
         ============================================ -->

    <linearGradient
      id="cyberGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop offset="0%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#4da6ff;#8a2be2;#ff00ff;#00ffff"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#8a2be2">
        <animate
          attributeName="stop-color"
          values="#8a2be2;#ff00ff;#00ffff;#8a2be2"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate
          attributeName="stop-color"
          values="#ff00ff;#00ffff;#7a00ff;#ff00ff"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <!-- ============================================
         SOFT NEON GLOW
         ============================================ -->

    <filter
      id="glow"
      x="-30%"
      y="-100%"
      width="160%"
      height="300%">

      <feGaussianBlur
        stdDeviation="1.7"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ============================================
       TERMINAL COMMAND
       ============================================ -->

  <text
    x="55"
    y="28"
    font-family="monospace"
    font-size="17"
    font-weight="bold"
    fill="#00ffff">

    root@n1se:~$ whoami

  </text>


  <!-- ============================================
       OUTPUT INDICATOR
       ============================================ -->

  <text
    x="55"
    y="67"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    fill="#8b949e">

    &gt;

  </text>


  <!-- ============================================
       01 — NIRMAL SEMALTI
       ============================================ -->

  <text
    x="82"
    y="67"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    letter-spacing="1"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Nirmal Semalti

    <animate
      attributeName="opacity"
      values="0;1;1;0;0"
      keyTimes="0;0.01;0.18;0.20;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================================
       02 — PROGRAMMER / PROBLEM SOLVER
       ============================================ -->

  <text
    x="82"
    y="67"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    letter-spacing="1"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Programmer. Problem Solver.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.20;0.21;0.38;0.40;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================================
       03 — BUILDING
       ============================================ -->

  <text
    x="82"
    y="67"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    letter-spacing="1"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Building what I once couldn't.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.40;0.41;0.58;0.60;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================================
       04 — JOURNEY
       ============================================ -->

  <text
    x="82"
    y="67"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    letter-spacing="1"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Still a long way to go.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.60;0.61;0.78;0.80;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================================
       05 — FINAL MESSAGE
       ============================================ -->

  <text
    x="82"
    y="67"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    letter-spacing="1"
    fill="url(#cyberGradient)"
    filter="url(#glow)"
    opacity="0">

    Keep building.

    <animate
      attributeName="opacity"
      values="0;0;1;1;0"
      keyTimes="0;0.80;0.81;0.98;1"
      dur="25s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================================
       SYSTEM STATUS
       ============================================ -->

  <circle
    cx="58"
    cy="98"
    r="3"
    fill="#00ff9c">

    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="1.6s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="72"
    y="102"
    font-family="monospace"
    font-size="8"
    letter-spacing="3"
    fill="#484f58">

    IDENTITY_STREAM://ACTIVE

  </text>

</svg>
