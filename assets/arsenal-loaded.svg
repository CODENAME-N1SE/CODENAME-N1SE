<svg width="600" height="46"
     viewBox="0 0 600 46"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="cyberGlow"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#7a00ff;#ff00ff;#00ffff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#7a00ff">
        <animate
          attributeName="stop-color"
          values="#7a00ff;#ff00ff;#00ffff;#7a00ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate
          attributeName="stop-color"
          values="#ff00ff;#00ffff;#7a00ff;#ff00ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>

    <filter id="glow"
            x="-20%"
            y="-80%"
            width="140%"
            height="260%">

      <feGaussianBlur stdDeviation="2.2" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <text
    x="0"
    y="29"
    font-family="monospace"
    font-size="14"
    fill="#8b949e">

    STATUS ::

  </text>


  <text
    x="82"
    y="29"
    font-family="monospace"
    font-size="14"
    fill="#00ffff">

    [████████████]

  </text>


  <text
    x="235"
    y="29"
    font-family="monospace"
    font-size="16"
    font-weight="bold"
    letter-spacing="2"
    fill="url(#cyberGlow)"
    filter="url(#glow)">

    ARSENAL LOADED

  </text>


  <circle
    cx="411"
    cy="24"
    r="4"
    fill="#00ff9c">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.2s"
      repeatCount="indefinite"/>

  </circle>

</svg>
