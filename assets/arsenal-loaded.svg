<svg width="520" height="55"
     viewBox="0 0 520 55"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="cyberGlow"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#7a00ff;#ff00ff;#00ffff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#7a00ff">
        <animate
          attributeName="stop-color"
          values="#7a00ff;#ff00ff;#00ffff;#7a00ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate
          attributeName="stop-color"
          values="#ff00ff;#00ffff;#7a00ff;#ff00ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>

    <filter id="glow"
            x="-30%"
            y="-80%"
            width="160%"
            height="260%">

      <feGaussianBlur stdDeviation="2.5" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>

  <!-- Status -->

  <text
    x="5"
    y="34"
    font-family="monospace"
    font-size="14"
    fill="#8b949e">

    STATUS ::

  </text>

  <!-- Progress bar -->

  <text
    x="85"
    y="34"
    font-family="monospace"
    font-size="14"
    fill="#00ffff">

    [██████████]

  </text>

  <!-- Glowing text -->

  <text
    x="220"
    y="34"
    font-family="monospace"
    font-size="16"
    font-weight="bold"
    letter-spacing="2"
    fill="url(#cyberGlow)"
    filter="url(#glow)">

    ARSENAL LOADED

  </text>

  <!-- Online indicator -->

  <circle
    cx="390"
    cy="29"
    r="4"
    fill="#00ff9c">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1.2s"
      repeatCount="indefinite"/>

  </circle>

</svg>
