<svg width="900" height="70" viewBox="0 0 900 70"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="liveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff">
        <animate attributeName="stop-color"
          values="#00ffff;#8a2be2;#ff00ff;#00ffff"
          dur="6s" repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate attributeName="stop-color"
          values="#ff00ff;#00ffff;#8a2be2;#ff00ff"
          dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="liveGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- left line -->
  <line x1="100" y1="35" x2="330" y2="35"
        stroke="#30363d" stroke-width="1"/>

  <!-- moving signal on left -->
  <rect x="100" y="34" width="70" height="2"
        fill="url(#liveGradient)"
        filter="url(#liveGlow)">
    <animate attributeName="x"
      values="100;260;100"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>

  <!-- live indicator -->
  <circle cx="366" cy="34" r="4" fill="#00ff9c">
    <animate attributeName="opacity"
      values="1;0.2;1"
      dur="1.4s"
      repeatCount="indefinite"/>
  </circle>

  <!-- label -->
  <text x="450" y="40"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        font-weight="bold"
        letter-spacing="4"
        fill="url(#liveGradient)"
        filter="url(#liveGlow)">
    CURRENTLY_BUILDING
  </text>

  <!-- right line -->
  <line x1="570" y1="35" x2="800" y2="35"
        stroke="#30363d" stroke-width="1"/>

  <!-- moving signal on right -->
  <rect x="730" y="34" width="70" height="2"
        fill="url(#liveGradient)"
        filter="url(#liveGlow)">
    <animate attributeName="x"
      values="730;570;730"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>

</svg>
