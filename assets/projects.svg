<svg width="900" height="160"
     viewBox="0 0 900 160"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="projectGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#8a2be2;#ff00ff;#00ffff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#8a2be2">
        <animate
          attributeName="stop-color"
          values="#8a2be2;#ff00ff;#00ffff;#8a2be2"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate
          attributeName="stop-color"
          values="#ff00ff;#00ffff;#8a2be2;#ff00ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <filter id="projectGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <text
    x="450"
    y="65"
    text-anchor="middle"
    font-family="monospace"
    font-size="28"
    font-weight="bold"
    letter-spacing="4"
    fill="url(#projectGradient)"
    filter="url(#projectGlow)">

    PROJECT_DATABASE

  </text>


  <text
    x="450"
    y="100"
    text-anchor="middle"
    font-family="monospace"
    font-size="12"
    letter-spacing="5"
    fill="#8b949e">

    N1SE // DEPLOYED SYSTEMS

  </text>


  <line
    x1="100"
    y1="125"
    x2="800"
    y2="125"
    stroke="url(#projectGradient)"
    stroke-width="2">

    <animate
      attributeName="stroke-dasharray"
      values="0,700;700,0"
      dur="2s"
      fill="freeze"/>

  </line>

</svg>
