<svg width="900" height="115"
     viewBox="0 0 900 115"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="projectGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#7a00ff;#ff00ff;#00ffff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#7a00ff">
        <animate
          attributeName="stop-color"
          values="#7a00ff;#ff00ff;#00ffff;#7a00ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate
          attributeName="stop-color"
          values="#ff00ff;#00ffff;#7a00ff;#ff00ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <filter id="projectGlow"
            x="-20%"
            y="-50%"
            width="140%"
            height="200%">

      <feGaussianBlur stdDeviation="3" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <text
    x="450"
    y="47"
    text-anchor="middle"
    font-family="monospace"
    font-size="28"
    font-weight="bold"
    letter-spacing="4"
    fill="url(#projectGradient)"
    filter="url(#projectGlow)">

    PROJECT_DATABASE

  </text>


  <text
    x="450"
    y="82"
    text-anchor="middle"
    font-family="monospace"
    font-size="12"
    letter-spacing="6"
    fill="#8b949e">

    N1SE // PROJECT ARCHIVE

  </text>

</svg>
