  </text>


  <!-- ==========================================
       SYSTEM ONLINE
       ========================================== -->

  <circle
    cx="365"
    cy="263"
    r="4"
    fill="#00ff9c">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="382"
    y="267"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
    letter-spacing="3"
    fill="#00ff9c">

    SYSTEM ONLINE

  </text>


  <!-- ==========================================
       SUBTLE DATA PARTICLES
       ========================================== -->

  <circle
    cx="180"
    cy="82"
    r="2"
    fill="#00ffff">

    <animate
      attributeName="cy"
      values="82;67;82"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.1;0.55;0.1"
      dur="5s"
      repeatCount="indefinite"/>

