    font-size="48"
    font-weight="bold"
    letter-spacing="5"
    fill="#8a2be2"
    filter="url(#mainGlow)"
    opacity="0">

    NIRMAL SEMΛLTI

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.05;0.85;1"
      dur="0.18s"
      begin="0.54s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <!-- FRAME 05 -->

  <text
    x="454"
