      dur="0.18s"
      begin="0.72s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <!-- ==========================================
       FINAL RGB SIGNAL SPLIT
       ========================================== -->

  <text
    x="443"
    y="137"
    text-anchor="middle"
    font-family="monospace"
    font-size="48"
    font-weight="bold"
    letter-spacing="5"
    fill="#00ffff"
    opacity="0">

    NIRMAL SEMALTI

    <animate
      attributeName="opacity"
      values="0;0.45;0"
      dur="0.15s"
      begin="0.90s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <text
    x="457"
    y="137"
    text-anchor="middle"
    font-family="monospace"
    font-size="48"
    font-weight="bold"
    letter-spacing="5"
    fill="#ff00ff"
    opacity="0">

    NIRMAL SEMALTI

    <animate
      attributeName="opacity"
      values="0;0.40;0"
      dur="0.15s"
      begin="0.90s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <!-- ==========================================
       FINAL STABLE NAME
       ========================================== -->

  <text
    x="450"
    y="137"
    text-anchor="middle"
    font-family="monospace"
    font-size="48"
    font-weight="bold"
    letter-spacing="5"
    fill="url(#cyberGradient)"
    filter="url(#mainGlow)"
    opacity="0">

    NIRMAL SEMALTI

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.20s"
      begin="1.05s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <!-- ==========================================
       IDENTITY VERIFIED
       ========================================== -->

  <text
    x="450"
    y="160"
    text-anchor="middle"
    font-family="monospace"
    font-size="8"
    letter-spacing="4"
    fill="#00ff9c"
    opacity="0">

    [ IDENTITY VERIFIED ]

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.35s"
      begin="1.20s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <!-- ==========================================
       CODENAME
       ========================================== -->

  <text
    x="450"
    y="184"
    text-anchor="middle"
    font-family="monospace"
    font-size="15"
    font-weight="bold"
    letter-spacing="7"
    fill="#b026ff"
    opacity="0">

    &lt; CODENAME_N1SE /&gt;

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.50s"
      begin="1.35s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <!-- ==========================================
       SCANNER RAIL
       ========================================== -->

  <line
    x1="100"
    y1="207"
    x2="800"
    y2="207"
    stroke="#30363d"
    stroke-width="1"/>


  <!-- ==========================================
       SLOW SCANNER
       ========================================== -->

  <rect
    x="-300"
    y="206"
    width="300"
    height="2"
    fill="url(#scannerGradient)"
    filter="url(#smallGlow)"
    opacity="0.60">

    <animate
      attributeName="x"
      values="-300;900"
      dur="9s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ==========================================
       DIAGNOSTICS
       ========================================== -->

  <text
    x="100"
    y="233"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#8b949e">

    ACCESS://GRANTED

  </text>


  <text
    x="450"
    y="233"
    text-anchor="middle"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#8b949e">

    SIGNAL://100%

    <animate
      attributeName="opacity"
      values="0.45;1;0.45"
      dur="2.8s"
      repeatCount="indefinite"/>

  </text>


  <text
    x="800"
    y="233"
    text-anchor="end"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#8b949e">

    NODE://ACTIVE

  </text>


  <!-- ==========================================
       RETRO LOWER STATUS BLOCKS
       ========================================== -->


  <!-- LEFT PIXEL DATA -->

  <rect
    x="30"
    y="258"
    width="5"
    height="5"
    fill="#8a2be2">

    <animate
      attributeName="opacity"
      values="0.25;0.85;0.25"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>


  <rect
    x="40"
    y="258"
    width="18"
    height="5"
    fill="#8a2be2"
    opacity="0.35"/>


  <rect
    x="63"
    y="258"
    width="8"
    height="5"
    fill="#8a2be2"
    opacity="0.20"/>


  <!-- RIGHT PIXEL DATA -->

  <rect
    x="865"
    y="258"
    width="5"
    height="5"
    fill="#00ffff">

    <animate
      attributeName="opacity"
      values="0.85;0.25;0.85"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>


  <rect
    x="842"
    y="258"
    width="18"
    height="5"
    fill="#00ffff"
    opacity="0.35"/>


  <rect
    x="829"
    y="258"
    width="8"
    height="5"
    fill="#00ffff"
    opacity="0.20"/>


  <!-- ==========================================
       BINARY N1SE SIGNATURE
       ========================================== -->

  <text
    x="30"
    y="285"
    font-family="monospace"
    font-size="7"
    letter-spacing="1"
    fill="#8a2be2"
    opacity="0.50">

    01001110 00110001 01010011 01000101

  </text>


  <!-- ==========================================
       CRT MODE
       ========================================== -->

  <text
    x="870"
    y="285"
    text-anchor="end"
    font-family="monospace"
    font-size="8"
    letter-spacing="2"
    fill="#00ffff"
    opacity="0.50">

