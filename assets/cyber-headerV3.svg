    text-anchor="middle"
    font-family="monospace"
    font-size="48"
    font-weight="bold"
    letter-spacing="5"
    fill="#ff00ff"
    filter="url(#mainGlow)"
    opacity="0">

    NIR#AL SEMALTI

    <animate
