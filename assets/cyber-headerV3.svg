    opacity="0">

    NIRMAL S3MALTI

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.05;0.85;1"
      dur="0.18s"
      begin="0.36s"
      repeatCount="1"
      fill="freeze"/>

  </text>


  <!-- FRAME 04 -->

  <text
