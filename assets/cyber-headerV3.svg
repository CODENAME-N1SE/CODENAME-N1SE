<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ==========================================
         MAIN NEON GRADIENT
         ========================================== -->

    <linearGradient
      id="cyberGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop offset="0%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#008cff;#8a2be2;#ff00ff;#00ffff"
          dur="7s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#8a2be2">
        <animate
          attributeName="stop-color"
          values="#8a2be2;#ff00ff;#00ffff;#8a2be2"
          dur="7s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00ff">
        <animate
          attributeName="stop-color"
          values="#ff00ff;#00ffff;#8a2be2;#ff00ff"
          dur="7s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <!-- ==========================================
         SCANNER GRADIENT
         ========================================== -->

    <linearGradient
      id="scannerGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop
        offset="0%"
        stop-color="#00ffff"
        stop-opacity="0"/>

      <stop
        offset="45%"
        stop-color="#00ffff"
        stop-opacity="0.30"/>

      <stop
        offset="50%"
        stop-color="#ffffff"
        stop-opacity="0.90"/>

      <stop
        offset="55%"
        stop-color="#ff00ff"
        stop-opacity="0.30"/>

      <stop
        offset="100%"
        stop-color="#ff00ff"
        stop-opacity="0"/>

    </linearGradient>


    <!-- ==========================================
         MAIN NAME GLOW
         ========================================== -->

    <filter
      id="mainGlow"
      x="-40%"
      y="-100%"
      width="180%"
      height="300%">

      <feGaussianBlur
        stdDeviation="3.5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ==========================================
         SMALL GLOW
         ========================================== -->

    <filter
      id="smallGlow"
      x="-40%"
      y="-100%"
      width="180%"
      height="300%">

      <feGaussianBlur
        stdDeviation="1.5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ==========================================
       SUBTLE CRT GRID
       ========================================== -->

  <g opacity="0.045">

    <line
      x1="0"
      y1="50"
      x2="900"
      y2="50"
      stroke="#00ffff"/>

    <line
      x1="0"
      y1="100"
      x2="900"
      y2="100"
      stroke="#00ffff"/>

    <line
      x1="0"
      y1="150"
      x2="900"
      y2="150"
      stroke="#00ffff"/>

    <line
      x1="0"
      y1="200"
      x2="900"
      y2="200"
      stroke="#00ffff"/>

    <line
      x1="0"
      y1="250"
      x2="900"
      y2="250"
      stroke="#00ffff"/>


    <line
      x1="150"
      y1="0"
      x2="150"
      y2="300"
      stroke="#8a2be2"/>

    <line
      x1="300"
      y1="0"
      x2="300"
      y2="300"
      stroke="#8a2be2"/>

    <line
      x1="450"
      y1="0"
      x2="450"
      y2="300"
      stroke="#8a2be2"/>

    <line
      x1="600"
      y1="0"
      x2="600"
      y2="300"
      stroke="#8a2be2"/>

    <line
      x1="750"
      y1="0"
      x2="750"
      y2="300"
      stroke="#8a2be2"/>

  </g>


  <!-- ==========================================
       RETRO CRT / BOOT DETAILS
       ========================================== -->


  <!-- TOP LEFT BOOT LABEL -->

  <text
    x="30"
    y="27"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#00ffff"
    opacity="0.65">

    [BOOT://N1SE]

  </text>


  <!-- TOP RIGHT MEMORY LABEL -->

  <text
    x="870"
    y="27"
    text-anchor="end"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#ff00ff"
    opacity="0.65">

    MEM://0xN1SE

  </text>


  <!-- LEFT PIXEL MARKER -->

  <path
    d="M30 52 H38 V60 H46"
    fill="none"
    stroke="#00ffff"
    stroke-width="2"
    opacity="0.55"/>


  <rect
    x="52"
    y="57"
    width="4"
    height="4"
    fill="#00ffff"
    opacity="0.35"/>


  <!-- RIGHT PIXEL MARKER -->

  <path
    d="M870 52 H862 V60 H854"
    fill="none"
    stroke="#ff00ff"
    stroke-width="2"
    opacity="0.55"/>


  <rect
    x="844"
    y="57"
    width="4"
    height="4"
    fill="#ff00ff"
    opacity="0.35"/>


  <!-- ==========================================
       TOP SYSTEM INFORMATION
       ========================================== -->

  <text
    x="70"
    y="48"
    font-family="monospace"
    font-size="9"
    letter-spacing="3"
    fill="#00ffff"
    opacity="0.75">

    N1SE://IDENTITY_NODE

  </text>


  <circle
    cx="760"
    cy="43"
    r="3.5"
    fill="#00ff9c">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="774"
    y="47"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#00ff9c">

    ONLINE

  </text>


  <!-- ==========================================
       ONE-TIME IDENTITY CORRUPTION
       ========================================== -->


  <!-- FRAME 01 -->

  <text
    x="450"
    y="137"
    text-anchor="middle"
    font-family="monospace"
    font-size="48"
    font-weight="bold"
    letter-spacing="5"
    fill="#00ffff"
    filter="url(#mainGlow)"
    opacity="0">

    N1RMAL SEMALTI

    <animate
